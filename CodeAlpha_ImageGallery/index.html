<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visual Moments - A beautiful responsive image gallery.">
    <title>Visual Moments | Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <a href="#" class="logo">Visual<span>Moments.</span></a>

        <nav>
            <a href="#gallery">Explore Gallery</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <p class="subtitle">CAPTURE • EXPLORE • REMEMBER</p>
        <h1>Every Picture Tells a Story.</h1>
        <p class="hero-text">
            Explore beautiful moments captured from around the world.
        </p>
    </section>

    <!-- Gallery Section -->
    <main id="gallery" class="gallery-section">

        <div class="section-heading">
            <h2>Explore Our Gallery</h2>
            <p>A collection of beautiful moments.</p>
        </div>

        <!-- Category Filters -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
            <button class="filter-btn" data-filter="travel">Travel</button>
            <button class="filter-btn" data-filter="animals">Animals</button>
        </div>

        <!-- Images will be added using JavaScript -->
        <div class="gallery-grid" id="galleryGrid"></div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>

        <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous image">
            &#10094;
        </button>

        <div class="lightbox-content">
            <img src="" alt="" id="lightboxImage">
            <p id="imageCaption"></p>
        </div>

        <button class="nav-btn next-btn" id="nextBtn" aria-label="Next image">
            &#10095;
        </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Visual Moments. All Rights Reserved.</p>
        <p>Designed with ❤️ using HTML, CSS & JavaScript.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
