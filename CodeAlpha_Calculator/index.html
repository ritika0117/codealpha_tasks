<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern and responsive calculator built using HTML, CSS and JavaScript.">

    <title>Calculator | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <div class="calculator">

            <!-- Calculator Header -->
            <div class="calculator-header">
                <h1>Calculator</h1>
                <p>Simple calculations, made easy.</p>
            </div>

            <!-- Display Screen -->
            <div class="display">
                <div id="previousOperand" class="previous-operand"></div>
                <div id="currentOperand" class="current-operand">0</div>
            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="btn utility" data-action="clear">AC</button>
                <button class="btn utility" data-action="delete">DEL</button>
                <button class="btn utility" data-action="percent">%</button>
                <button class="btn operator" data-operator="/">÷</button>

                <button class="btn number" data-number="7">7</button>
                <button class="btn number" data-number="8">8</button>
                <button class="btn number" data-number="9">9</button>
                <button class="btn operator" data-operator="*">×</button>

                <button class="btn number" data-number="4">4</button>
                <button class="btn number" data-number="5">5</button>
                <button class="btn number" data-number="6">6</button>
                <button class="btn operator" data-operator="-">−</button>

                <button class="btn number" data-number="1">1</button>
                <button class="btn number" data-number="2">2</button>
                <button class="btn number" data-number="3">3</button>
                <button class="btn operator" data-operator="+">+</button>

                <button class="btn number zero" data-number="0">0</button>
                <button class="btn number" data-action="decimal">.</button>
                <button class="btn equals" data-action="calculate">=</button>

            </div>

            <!-- Footer -->
            <div class="calculator-footer">
                <p>Designed with ❤️ using HTML, CSS & JavaScript</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
